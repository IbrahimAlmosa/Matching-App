<title>VOLUNTR Together</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Prototype D combines A (card flow, tab bar, match ring, navy and marigold) with C (large readable type, text-size control, task-based home screens, plain-language reasons, PCC phone line).
   Layout: one app, two shells. Phone: one column, bottom tab bar, one opportunity card at a time. Desktop: header, left nav rail, wide two-column cards. The shell follows screen width; the Phone/Desktop switch previews either. */
:root {
  --bg: #e9edf1; --surface: #ffffff; --surface-2: #f3f6f9; --ink: #14212e; --muted: #556575; --line: #d6dee6;
  --navy: #13395b; --navy-ink: #ffffff; --head: #13395b; --head-ink: #ffffff; --accent: #f0b429; --accent-ink: #2a1d00;
  --ok: #23704f; --ok-bg: #e2f2ea; --warn: #8a5a00; --warn-bg: #fdf1d6; --bad: #a33232; --bad-bg: #fbe6e6;
  --font: "Atkinson Hyperlegible", "Public Sans", Verdana, "Segoe UI", sans-serif; --display: "Public Sans", "Segoe UI", Roboto, sans-serif; --scale: 1;
  --r: 14px; --shadow: 0 1px 2px rgba(19,57,91,.08), 0 8px 24px rgba(19,57,91,.10);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c141b; --surface: #15202b; --surface-2: #1b2836; --ink: #e5ecf2; --muted: #9aabbb; --line: #2a3a4a;
  --navy: #9cc3e6; --navy-ink: #0c1a27; --head: #102b42; --head-ink: #e5ecf2; --accent: #f3c04d; --accent-ink: #2a1d00;
  --ok: #6fd3a5; --ok-bg: #173329; --warn: #f3c04d; --warn-bg: #352a12; --bad: #f19a9a; --bad-bg: #3a1c1c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c141b; --surface: #15202b; --surface-2: #1b2836; --ink: #e5ecf2; --muted: #9aabbb; --line: #2a3a4a;
  --navy: #9cc3e6; --navy-ink: #0c1a27; --head: #102b42; --head-ink: #e5ecf2; --accent: #f3c04d; --accent-ink: #2a1d00;
  --ok: #6fd3a5; --ok-bg: #173329; --warn: #f3c04d; --warn-bg: #352a12; --bad: #f19a9a; --bad-bg: #3a1c1c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--font); }
h2, h3, .brand, .kpi b, .ring span { font-family: var(--display); }
.screen { zoom: var(--scale); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px var(--ink); }
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; display: grid; gap: 16px; justify-items: center; }
.proto-bar { width: 100%; max-width: 1180px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.proto-bar h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .02em; }
.proto-bar h1 span { color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.app { width: 100%; max-width: 400px; height: min(780px, calc(100dvh - 120px)); min-height: 560px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; position: relative; }
@media (max-width: 440px) { .app { border-radius: 18px; height: calc(100dvh - 110px); } }
.top { background: var(--head); color: var(--head-ink); padding: 14px 18px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-weight: 800; letter-spacing: .14em; font-size: 15px; }
.brand small { display: block; font-weight: 500; letter-spacing: .02em; font-size: 11px; opacity: .8; }
.top .who { font-size: 13px; opacity: .9; text-align: right; }
.screen { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { border: 0; background: transparent; padding: 8px 2px 10px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--navy); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 800; border-radius: 999px; padding: 0 5px; line-height: 16px; }
h2 { margin: 0; font-size: 20px; line-height: 1.25; text-wrap: balance; }
h3 { margin: 0; font-size: 16px; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.opp { box-shadow: var(--shadow); border: 0; }
.org-row { display: flex; gap: 10px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 10px; background: var(--navy); color: var(--navy-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.navy { background: var(--navy); color: var(--navy-ink); border-color: transparent; }
dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.match { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--surface-2); border-radius: 10px; }
.ring { --p: 80; width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--navy) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.match ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
details summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--navy); }
.bars { display: grid; gap: 6px; margin-top: 8px; font-size: 12.5px; }
.bar { display: grid; grid-template-columns: 1fr 90px 34px; gap: 8px; align-items: center; }
.bar i { display: block; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar i b { position: absolute; inset: 0 auto 0 0; background: var(--navy); border-radius: 3px; }
.bar em { font-style: normal; font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr auto 1.3fr; gap: 8px; }
.btn { border: 1.5px solid var(--navy); background: transparent; color: var(--navy); border-radius: 12px; padding: 11px 14px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; justify-content: center; min-height: 48px; }
.btn.solid { background: var(--navy); color: var(--navy-ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: var(--line); color: var(--ink); }
.btn.small { padding: 6px 10px; min-height: 36px; font-size: 13.5px; border-radius: 10px; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn svg { width: 18px; height: 18px; }
.note { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.linkish { background: none; border: 0; padding: 0; color: var(--navy); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner.info { background: var(--surface); border: 1px dashed var(--line); color: var(--muted); }
.list { display: grid; gap: 10px; }
.row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.row > div { min-width: 0; }
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress b { display: block; height: 100%; background: var(--ok); }
.stack { display: grid; gap: 4px; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 14px; font-weight: 600; }
.field .hint { font-size: 12.5px; color: var(--muted); }
input[type="text"], input[type="email"], input[type="date"], input[type="number"], input[type="time"], select, textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); min-height: 44px; }
textarea { min-height: 80px; resize: vertical; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; }
.pick button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--navy-ink); }
.grid-week { display: grid; grid-template-columns: 52px repeat(3, 1fr); gap: 4px; font-size: 12.5px; }
.grid-week span { color: var(--muted); align-self: center; font-weight: 600; }
.grid-week button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 0; font-size: 12px; font-weight: 600; }
.grid-week button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.steps { display: flex; gap: 4px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--navy); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 76px; background: var(--ink); color: var(--surface); padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); transition: opacity .2s, transform .2s; }
.toast[hidden] { display: none; }
.sheet-wrap { position: absolute; inset: 0; background: rgba(10,20,30,.45); display: flex; align-items: flex-end; }
.sheet { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0; padding: 18px 16px 22px; display: grid; gap: 12px; max-height: 80%; overflow-y: auto; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; font-size: 14px; background: var(--surface-2); }
.msg.me { margin-left: auto; background: var(--navy); color: var(--navy-ink); }
.msg small { display: block; opacity: .7; font-size: 11px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kpi b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.hbar { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: 13px; }
.hbar .track { height: 10px; background: var(--line); border-radius: 5px; position: relative; overflow: hidden; }
.hbar .track b { position: absolute; inset: 0 auto 0 0; background: var(--navy); opacity: .35; }
.hbar .track b + b { opacity: 1; }
.slider { display: grid; grid-template-columns: 1fr 44px; gap: 4px 10px; align-items: center; font-size: 14px; }
.slider input { grid-column: 1 / -1; accent-color: var(--navy); }
.slider output { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.legal { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }

/* ---------- Desktop shell ---------- */
.app[data-device="desktop"] { max-width: 1180px; height: min(860px, calc(100dvh - 110px)); border-radius: 16px; display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.app[data-device="desktop"] .top { grid-column: 1 / -1; padding: 14px 24px; }
.app[data-device="desktop"][data-join="1"] { grid-template-columns: minmax(0, 1fr); }
.app[data-device="desktop"] .tabs { grid-row: 2; display: flex; flex-direction: column; gap: 2px; border-top: 0; border-right: 1px solid var(--line); padding: 16px 10px; }
.app[data-device="desktop"] .tabs button { grid-template-columns: 22px 1fr auto; display: grid; justify-items: start; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14.5px; border-radius: 10px; text-align: left; }
.app[data-device="desktop"] .tabs button[aria-current="page"] { background: var(--surface-2); }
.app[data-device="desktop"] .tabs button[aria-current="page"]::before { top: 8px; bottom: 8px; left: 0; right: auto; width: 3px; height: auto; border-radius: 0 3px 3px 0; }
.app[data-device="desktop"] .badge { position: static; }
.app[data-device="desktop"] .tabs .rail-note { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px 12px; display: block; }
.app[data-device="desktop"] .screen { padding: 28px 32px; gap: 18px; }
.app[data-device="desktop"] .opp { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px 28px; align-items: start; max-width: 1000px; padding: 24px; }
.app[data-device="desktop"] .opp > .opp-main, .app[data-device="desktop"] .opp > .opp-side { display: flex; flex-direction: column; gap: 14px; }
.app[data-device="desktop"] .opp .actions { grid-column: 1 / -1; grid-template-columns: 1fr auto 1.6fr; max-width: 640px; justify-self: end; width: 100%; }
.app[data-device="desktop"] h2 { font-size: 22px; }
.app[data-device="desktop"] .cards { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start; }
.app[data-device="desktop"] .kpis { grid-template-columns: repeat(5, 1fr); }
.app[data-device="desktop"] .kpis .kpi { grid-column: auto !important; }
.app[data-device="desktop"] .narrow { max-width: 680px; }
.app[data-device="desktop"] .toast { left: auto; right: 24px; bottom: 24px; max-width: 420px; }
.app[data-device="desktop"] .sheet-wrap { align-items: center; justify-content: center; }
.app[data-device="desktop"] .sheet { width: min(520px, 90%); border-radius: 16px; }
.app[data-device="desktop"] .two-col { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
.app[data-device="desktop"] .side-only { display: flex; }
.side-only { display: none; }
/* ---------- From C: task home, text size, help line ---------- */
.tasks { display: grid; gap: 10px; }
.app[data-device="desktop"] .tasks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.task { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.task:hover { border-color: var(--navy); }
.task b { font-size: 17px; font-family: var(--display); }
.task span { color: var(--muted); font-size: 14.5px; grid-column: 1; }
.task .arrow { grid-row: 1 / span 2; grid-column: 2; font-style: normal; font-size: 22px; color: var(--navy); }
.task .cnt { display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 9px; font-size: 13px; margin-left: 8px; vertical-align: 2px; }
.greet { display: grid; gap: 4px; }
.greet h2 { font-size: 26px; }
.app[data-device="desktop"] .greet h2 { font-size: 30px; }
.lead { color: var(--muted); font-size: 17px; margin: 0; }
.fitlabel { font-weight: 700; color: var(--ok); font-size: 15px; }
.textsize { display: inline-flex; gap: 2px; align-items: center; font-size: 12px; }
.textsize button { background: transparent; border: 1px solid transparent; color: inherit; border-radius: 6px; padding: 0 6px; line-height: 26px; font-weight: 700; }
.textsize button[aria-pressed="true"] { border-color: currentColor; }
.top .right { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.helpline { font-size: 12.5px; text-align: right; display: none; }
.helpline b { display: block; font-size: 15px; }
.app[data-device="desktop"] .helpline { display: block; }
.callbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 2px dashed var(--line); border-radius: var(--r); padding: 12px 16px; font-size: 15px; }
/* ---------- Sign-up landing ---------- */
.hero { background: var(--head); color: var(--head-ink); border-radius: var(--r); padding: 22px 20px; display: grid; gap: 12px; }
.hero h2 { font-size: 26px; line-height: 1.15; }
.hero p { margin: 0; opacity: .9; }
.hero .btn.accent { justify-self: start; }
.app[data-device="desktop"] .hero { padding: 40px 40px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px 40px; align-items: center; }
.app[data-device="desktop"] .hero h2 { font-size: 36px; }
.app[data-device="desktop"] .hero .hero-copy { display: grid; gap: 14px; }
.outline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.outline li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.outline li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.outline li b { display: block; font-size: 15px; }
.hero .outline li span { opacity: .85; }
.promises { display: grid; gap: 10px; }
.app[data-device="desktop"] .promises { grid-template-columns: repeat(3, 1fr); }
.promise { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.promise svg { width: 20px; height: 20px; flex: none; color: var(--ok); margin-top: 1px; }
.sum { display: grid; gap: 10px; font-size: 13.5px; }
.sum h4 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.sum p { margin: 2px 0 0; }
.sum .empty { color: var(--muted); font-style: italic; }
.dev-seg { display: none; }
@media (min-width: 720px) { .dev-seg { display: inline-flex; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.enter { animation: rise .25s ease-out; }
@keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
</style>

<div class="page">
  <div class="proto-bar">
    <h1>Prototype D · Together <span>A + C, phone and desktop</span></h1>
    <div class="seg dev-seg" role="group" aria-label="Preview size">
      <button data-device="phone" aria-pressed="false">Phone</button>
      <button data-device="desktop" aria-pressed="false">Desktop</button>
    </div>
    <div class="seg" role="group" aria-label="View as">
      <button data-role="join" aria-pressed="true">Sign up</button>
      <button data-role="vol" aria-pressed="false">Volunteer</button>
      <button data-role="org" aria-pressed="false">Organization</button>
      <button data-role="adm" aria-pressed="false">PCC admin</button>
    </div>
  </div>
  <div class="app" id="app" data-device="phone">
    <header class="top"><div class="brand">VOLUNTR<small>by Pitt County Cares</small></div><div class="right"><div class="helpline">Prefer to talk to someone?<b>Call PCC: (252) 555-0100</b></div><div class="textsize" role="group" aria-label="Text size"><button data-size="1" aria-pressed="true" aria-label="Standard text">A</button><button data-size="1.15" aria-pressed="false" aria-label="Larger text" style="font-size:15px">A</button><button data-size="1.3" aria-pressed="false" aria-label="Largest text" style="font-size:18px">A</button></div><div class="who" id="who"></div></div></header>
    <main class="screen" id="screen" tabindex="-1"></main>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
    <div class="toast" id="toast" role="status" hidden></div>
    <div id="sheet"></div>
  </div>
  <p class="sub" style="max-width:520px;text-align:center">Clickable prototype with sample data. Nothing is saved or sent.</p>
</div>

<script>
/* VOLUNTR prototype sample data. Shared by all three prototypes so the client
   compares layouts, not content. Field names follow the Sprint 2 logical ERD
   (Organization, Opportunity, Volunteer, VolunteerAvailability, Interest,
   Connection, Skill, CauseArea, MatchingRule, Administrator). All people,

    <div class="org-row"><div class="avatar" aria-hidden="true">${esc(o.org.short)}</div><div class="stack"><span class="eyebrow">${esc(o.org.name)}</span><h2>${esc(o.title)}</h2></div></div>
    <div class="chips"><span class="chip">${esc(o.roleType)}</span><span class="chip">${esc(o.commitment)}</span>${o.bgCheck ? '<span class="chip warn">Background check</span>' : ""}${o.remote === "Remote" ? '<span class="chip ok">Remote</span>' : ""}</div>
    <p class="sub" style="color:var(--ink)">${esc(o.description)}</p>
    <dl class="facts"><dt>When</dt><dd>${esc(o.when)}</dd><dt>Where</dt><dd>${esc(o.location)}${o.distance ? ` · ${o.distance} mi` : ""}</dd><dt>Needed</dt><dd>${o.needed - o.filled} of ${o.needed} spots open</dd><dt>Skills</dt><dd>${o.skills.map(s => esc(s.name) + (s.required ? " (required)" : "")).join(", ")}</dd></dl></div>
    <div class="opp-side"><div class="match"><div class="ring" style="--p:${o.score}"><span>${o.score}</span></div><div><div class="fitlabel">${o.score >= 85 ? "Excellent fit" : o.score >= 70 ? "Good fit" : "Possible fit"}</div><strong style="font-size:14px">Why we suggested this</strong><ul>${o.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div></div>
    <details><summary>See how the match score is calculated</summary>${fitBars(o)}<p class="sub" style="font-size:12.5px;margin-top:6px">Score = weighted average of the six criteria PCC sets. No contact details are shared until you and the organization both agree.</p></details></div>
    ${mode === "deck" ? `<div class="actions"><button class="btn quiet" data-act="pass" data-id="${o.id}">Not for me</button><button class="btn" data-act="save" data-id="${o.id}" aria-pressed="${S.saved.has(o.id)}" aria-label="Save for later">${I.bookmark}</button><button class="btn solid" data-act="interest" data-id="${o.id}">I'm interested</button></div>` : ""}
  </article>`;
}
const V = {};
const task = (tab, title, desc, count, act) => `<button class="task" ${act ? `data-act="${act}"` : `data-tab="${tab}"`}><b>${title}${count ? `<span class="cnt">${count}</span>` : ""}</b><span>${desc}</span><i class="arrow" aria-hidden="true">→</i></button>`;
const callbar = `<div class="callbar"><span>Prefer to talk to someone? We're happy to help by phone.</span><b>Call PCC: (252) 555-0100</b></div>`;
function hello() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }

  const d = deck().length, conn = S.conns.filter(c => c.status === "Connected").length, wait = S.conns.length - conn;

};
V.discover = () => {
  const d = deck();
  const head = `<div class="row"><div><h2>Opportunities for you</h2><p class="sub">Ranked by how well they fit your profile</p></div><span class="chip navy">${d.length ? `${Math.min(S.idx + 1, d.length)} of ${d.length}` : "Done"}</span></div>`;
  const ex = `<div class="note">${I.info}<span>${D.excluded.length} opportunities are hidden because you're not eligible. <button class="linkish" data-act="why">See why</button></span></div>`;
  if (!d.length) return head + `<div class="card"><h3>You've seen every current match</h3><p class="sub">We'll email you when a new opportunity fits your profile. You can also review the ones you saved.</p><button class="btn solid" data-tab="saved">Go to saved</button><button class="btn quiet" data-act="reset">Start over (demo)</button></div>` + ex;

V.profile = () => {
  const v = D.volunteer;
  const days = Object.entries(v.availability).filter(([, t]) => t.length).map(([d, t]) => `${d} ${t.join(" & ").toLowerCase()}`).join(", ");

    ${sec("When you're available", `<dl class="facts"><dt>Days</dt><dd>${esc(days)}</dd><dt>Commitment</dt><dd>${esc(v.commitment.join(", "))}</dd><dt>Format</dt><dd>${esc(v.remote)}</dd><dt>Seasonal</dt><dd>${esc(v.seasonal)}</dd></dl>`)}

/* ---------- Sign-up page + wizard (UC-VOL-01, UC-NFR-02/03/05) ---------- */

const SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>';
function vJoin() {
  return `<section class="hero"><div class="hero-copy"><span class="eyebrow" style="color:inherit;opacity:.8">Pitt County Cares · VOLUNTR</span><h2>Find volunteer work in Pitt County that fits your skills and your schedule</h2><p>Tell us what you care about, what you're good at and when you're free. We'll match you with local organizations that need exactly that.</p><button class="btn accent" data-act="wizardNew">Start sign-up</button><p style="font-size:13px">About 10 minutes · Free · 18 and older</p></div>

}
function wSummary(w, edit) {

  const slots = w.slots.map(x => x.replace("|", " ").toLowerCase().replace(/^(\w)/, c => c.toUpperCase())).join(", ");

  return `<div class="sum">${sec("About you", [w.first, w.last].filter(Boolean).join(" ") + (w.email ? ` · ${w.email}` : ""), 0)}${sec("Causes", w.causes.join(", "), 1)}${sec("Roles you'd accept", w.roles.join(", "), 2)}${sec("Skills", [...w.skills, w.cert].filter(Boolean).join(", "), 3)}${sec("Free times", slots, 4)}${sec("Commitment and format", [...w.commit, ...w.format].join(", ") + (w.commit.length || w.format.length ? ` · within ${w.radius} mi` : ""), 4)}</div>`;

    ${c.status === "Invited" ? `<span class="chip warn">You expressed interest. Waiting for ${esc(c.first)}.</span>` : ""}
    ${c.status === "Declined" ? `<span class="chip bad">Declined</span>` : ""}
    ${c.status === "Connected" ? `<div class="banner ok">${I.check}<span>Connected. You both got an email.</span></div><dl class="facts"><dt>Email</dt><dd>${esc(c.email)}</dd><dt>Phone</dt><dd>${esc(c.phone)}</dd></dl>` : ""}
  </div>`).join("")}</div>`;
};
V.post = () => {
  if (S.posted) return `<div class="banner ok">${I.check}<span><b>${esc(S.posted)}</b> is live.</span></div><div class="card"><h3>14 volunteers match this need</h3><p class="sub">They'll be notified today. You'll get an email when someone expresses interest.</p><button class="btn solid" data-act="postAnother">Post another need</button><button class="btn quiet" data-tab="postings">Back to postings</button></div>`;
  const pk = (name, opts, multi) => `<div class="pick" data-group="${name}" data-multi="${multi ? 1 : 0}">${opts.map((o, i) => `<button type="button" data-act="opt" aria-pressed="${!multi && i === 0}">${esc(o)}</button>`).join("")}</div>`;
  return `<h2>Post a volunteer need</h2><p class="sub">About 3 minutes. Every field helps us match the right people.</p>
  <form data-form="post" class="list narrow">
    <div class="field"><label for="pt">Title</label><input id="pt" type="text" placeholder="e.g. Saturday food distribution" required></div>
    <div class="field"><span class="lbl">Role type</span>${pk("role", D.roleTypes)}</div>
    <div class="field"><label for="pd">What will volunteers do?</label><textarea id="pd" placeholder="Two or three sentences"></textarea></div>
    <div class="field"><span class="lbl">Skills or credentials</span><span class="hint">Tap once for nice-to-have</span>${pk("skills", ["Food safety certification", "Spanish", "Event setup", "Customer service", "Data entry"], true)}</div>
    <div class="field"><span class="lbl">Time commitment</span>${pk("commit", D.commitments)}</div>
    <div class="row" style="gap:8px"><div class="field" style="flex:1"><label for="pdt">Date</label><input id="pdt" type="date" value="2026-11-21"></div><div class="field" style="flex:1"><label for="ptm">Start</label><input id="ptm" type="time" value="08:00"></div></div>
    <div class="field"><label for="pl">Location</label><input id="pl" type="text" value="Greenville (W 5th St)"></div>
    <div class="field"><span class="lbl">Can this be done remotely?</span>${pk("remote", ["In person", "Remote", "Hybrid"])}</div>
    <div class="row" style="gap:8px"><div class="field" style="flex:1"><label for="pn">Volunteers needed</label><input id="pn" type="number" min="1" value="10"></div><div class="field" style="flex:1"><label for="pa">Minimum age</label><input id="pa" type="number" min="18" value="18"></div></div>
    <label class="note" style="color:var(--ink)"><input id="pb" type="checkbox"> Background check required</label>
    <div class="field"><label for="pe">Remove this posting on</label><input id="pe" type="date" value="2026-11-20"><span class="hint">Expired postings drop out of matching automatically.</span></div>
    <button class="btn solid">Publish need</button>
  </form>`;
};
V.orgprofile = () => { const o = D.orgs[0]; return `<div class="org-row"><div class="avatar" style="width:56px;height:56px">${o.short}</div><div><h2>${esc(o.name)}</h2><span class="chip ok">Verified by PCC</span></div></div>
  <div class="card"><dl class="facts"><dt>Mission</dt><dd>${esc(o.mission)}</dd><dt>Causes</dt><dd>${esc(o.causes.join(", "))}</dd><dt>Location</dt><dd>${esc(o.location)}</dd><dt>Contact</dt><dd>${esc(o.contact)}</dd><dt>Email</dt><dd>${esc(o.email)}</dd><dt>Website</dt><dd>${esc(o.website)}</dd></dl><button class="btn quiet small">Edit profile</button></div>
  <div class="card"><div class="row"><div><h3>Two-step sign-in</h3><p class="sub">Optional for organizations</p></div><label class="note"><input id="omfa" type="checkbox"> On</label></div></div>`; };

/* ---------- Admin ---------- */
function vMfa() { return `<div class="card narrow" style="margin-top:20px">${I.lock.replace("<svg", '<svg width="32" height="32"')}<h2>Confirm it's you</h2><p class="sub">PCC admin accounts use two-step sign-in. Enter the 6-digit code from your authenticator app.</p><form data-form="mfa" class="list"><div class="field"><label for="code">Code</label><input id="code" type="text" inputmode="numeric" maxlength="6" value="482913"></div><button class="btn solid">Verify and continue</button></form></div>`; }
V.approvals = () => {
  const pend = S.orgs.filter(o => o.approval === "Pending");
  return `<h2>Organizations to approve</h2><p class="sub">Postings go live only after an organization is approved.</p>
  <div class="list cards">${pend.length ? pend.map(o => `<div class="card" ${o.flagged ? 'style="border-color:var(--bad)"' : ""}><div class="row"><div class="org-row"><div class="avatar">${o.short}</div><div><h3>${esc(o.name)}</h3><p class="sub">${esc(o.location)} · ${esc(o.submitted)}</p></div></div></div><p class="sub" style="color:var(--ink)">${esc(o.mission)}</p><div class="banner ${o.flagged ? "warn" : "info"}">${esc(o.note)}</div><dl class="facts"><dt>Contact</dt><dd>${esc(o.contact)}, ${esc(o.email)}</dd></dl><div class="chips"><button class="btn solid small" data-act="approve" data-id="${o.id}">Approve</button><button class="btn quiet small" data-act="askinfo" data-id="${o.id}">Ask for info</button><button class="btn danger small" data-act="reject" data-id="${o.id}">Reject</button></div></div>`).join("") : `<div class="banner ok">${I.check}<span>All caught up.</span></div>`}</div>
  <h3>Reported content</h3><div class="list cards">${D.flags.map(f => `<div class="card"><h3 style="font-size:15px">${esc(f.what)}</h3><p class="sub">${esc(f.why)} · ${esc(f.at)}</p><div class="chips"><button class="btn quiet small" data-act="flagok">Keep</button><button class="btn danger small" data-act="flagrm">Remove</button></div></div>`).join("")}</div>`;
};
V.attention = () => `<h2>Needs with no interest</h2><p class="sub">Open 10+ days with one or no interested volunteers. Step in and recruit directly.</p><div class="list cards">${D.lowInterest.map((n, i) => `<div class="card"><span class="eyebrow">${esc(n.org)}</span><h3>${esc(n.title)}</h3><div class="chips"><span class="chip bad">${n.days} days open</span><span class="chip">${n.interested} interested</span><span class="chip">${esc(n.roleType)}</span></div>${S.recruited.has(i) ? `<div class="banner ok">${I.check}<span>Added to Friday's newsletter list.</span></div>` : `<div class="chips"><button class="btn solid small" data-act="recruit" data-id="${i}">Add to newsletter</button><button class="btn quiet small" data-act="contactorg">Contact organization</button></div>`}</div>`).join("")}</div>`;
V.reports = () => {
  const s = D.stats, max = Math.max(...D.byCause.map(c => c.needs));
  return `<div class="row"><h2>Reports</h2><select aria-label="Period" style="width:auto"><option>Sep 15 – Oct 16, 2026</option><option>This month</option></select></div>
  <div class="kpis"><div class="kpi"><b>${s.orgs}</b><span>Organizations (${s.orgsPending} pending)</span></div><div class="kpi"><b>${s.volunteers}</b><span>Volunteers</span></div><div class="kpi"><b>${s.needs}</b><span>Needs posted</span></div><div class="kpi"><b>${s.connections}</b><span>Connections made</span></div><div class="kpi" style="grid-column:1/-1"><b>${s.filled}</b><span>Roles filled (${Math.round(s.filled / s.needs * 100)}% of needs posted)</span></div></div>
  <div class="card"><h3>Needs posted vs filled, by cause</h3>${D.byCause.map(c => `<div class="hbar"><div class="row"><span>${esc(c.cause)}</span><span class="sub" style="font-size:12.5px">${c.filled} / ${c.needs}</span></div><div class="track"><b style="width:${c.needs / max * 100}%"></b><b style="width:${c.filled / max * 100}%"></b></div></div>`).join("")}<p class="sub" style="font-size:12px">Light bar: needs posted. Dark bar: filled.</p></div>
  <div class="card"><h3>Export for newsletters and grants</h3><div class="chips"><button class="btn quiet small" data-act="export" data-id="volunteers.csv">Volunteers (CSV)</button><button class="btn quiet small" data-act="export" data-id="connections.csv">Connections (CSV)</button></div></div>`;
};
V.matching = () => {
  const total = S.weights.reduce((a, r) => a + (r.active ? r.weight : 0), 0);
  const ranked = D.opportunities.map(o => ({ o, s: D.score(o.fit, S.weights) })).sort((a, b) => b.s - a.s).slice(0, 3);
  return `<h2>Matching rules</h2><p class="sub">Transparent, rules-based scoring. Adjust how much each factor counts.</p>
  <div class="card">${S.weights.map((r, i) => `<div class="slider"><label for="w${i}">${esc(r.criterion)}</label><output>${r.weight}</output><input id="w${i}" type="range" min="0" max="50" step="5" value="${r.weight}" data-act="weight" data-id="${i}"></div>`).join("")}
  <div class="row"><b>Total</b><span class="chip ${total === 100 ? "ok" : "warn"}">${total} / 100</span></div></div>
  <div class="card"><h3>Preview: Jordan's top 3</h3><ol style="margin:0;padding-left:20px;font-size:14px">${ranked.map(x => `<li>${esc(x.o.title)} <b>${x.s}</b></li>`).join("")}</ol></div>
  <div class="note">${I.info}<span>Always excluded, regardless of weights: under minimum age, missing required credential, background check not accepted, schedule conflict.</span></div>
  <button class="btn solid" data-act="saveWeights" ${total === 100 ? "" : "disabled"}>Save weights</button>`;
};

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-role],[data-tab],[data-act],button[data-device],[data-size]");
  if (!b) return;
  if (b.dataset.device) { S.device = b.dataset.device; return render(); }
  if (b.dataset.size) { document.documentElement.style.setProperty("--scale", b.dataset.size); document.querySelectorAll("[data-size]").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
  if (b.dataset.role) { S.role = b.dataset.role; S.wizard = null; sheet(""); return render(); }
  if (b.dataset.tab) { S.tab[S.role] = b.dataset.tab; S.wizard = null; S.openConn = null; return render(); }
  const a = b.dataset.act, id = b.dataset.id;
  const o = D.opportunities.find(x => x.id === id);
  switch (a) {
    case "pass": S.passed.add(id); toast("Got it. We'll show fewer like this."); break;
    case "save": S.saved.has(id) ? S.saved.delete(id) : S.saved.add(id); toast(S.saved.has(id) ? "Saved for later" : "Removed from saved"); S.idx = (S.idx + 1) % Math.max(deck().length, 1); break;
    case "unsave": S.saved.delete(id); break;
    case "interest": S.interested.add(id); S.saved.delete(id); S.conns.push({ id: "x" + id, org: o.org, title: o.title, when: o.when, status: "Waiting for organization", messages: [] }); toast(`Interest sent to ${o.org.name}. We'll email you when they respond.`); break;
    case "why": sheet(`<h2>Hidden opportunities</h2><p class="sub">These don't meet a must-have requirement, so they never appear as matches.</p>${D.excluded.map(x => `<div class="card"><h3>${esc(x.title)}</h3><p class="sub">${esc(x.org)}</p><span class="chip bad">${esc(x.reason)}</span></div>`).join("")}<button class="btn solid" data-act="closeSheet">Close</button>`); return;
    case "terms": sheet(`<h2>Terms & privacy</h2><p class="sub" style="color:var(--ink)">Your contact details stay private until you and an organization both agree to connect. PCC does not screen, vet or supervise volunteers or organizations. Organizations are responsible for their own screening. Volunteers must be 18 or older.</p><button class="btn solid" data-act="closeSheet">Close</button>`); return;
    case "closeSheet": if (b.classList.contains("sheet-wrap") && e.target !== b) return; sheet(""); return;
    case "reset": S.passed.clear(); S.interested.clear(); S.idx = 0; break;
    case "openConn": S.openConn = id; break;
    case "closeConn": S.openConn = null; break;
    case "wizard": S.wizard = newWizard(true); break;
    case "wizardNew": S.wizard = newWizard(false); break;
    case "wizardClose": S.wizard = null; break;
    case "wback": S.wizard.step--; S.wizard.err = ""; break;
    case "wgo": S.wizard.step = +b.dataset.step; S.wizard.err = ""; break;
    case "orgSignup": toast("Organization registration opens a separate form, reviewed by PCC."); return;
    case "pick": { const arr = S.wizard[b.dataset.key], v = b.dataset.val; const i = arr.indexOf(v); i > -1 ? arr.splice(i, 1) : arr.push(v); b.setAttribute("aria-pressed", i === -1); return; }
    case "slot": { const arr = S.wizard.slots, v = b.dataset.val; const i = arr.indexOf(v); i > -1 ? arr.splice(i, 1) : arr.push(v); b.setAttribute("aria-pressed", i === -1); b.textContent = i === -1 ? "✓" : ""; return; }
    case "opt": { const g = b.parentElement; if (g.dataset.multi === "0") g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); return; }
    case "review": S.reviewFor = id; S.tab.org = "review"; break;
    case "toggle": { const p = S.postings.find(x => x.id === id); p.status = p.status === "Paused" ? "Active" : "Paused"; toast(p.status === "Paused" ? "Paused. Hidden from matching until you resume." : "Resumed. Back in matching."); break; }
    case "filled": { const p = S.postings.find(x => x.id === id); p.status = "Filled"; p.filled = p.needed; toast("Marked filled. Removed from matching."); break; }
    case "expiry": { const p = S.postings.find(x => x.id === id); p.expires = "Dec 15, 2026"; delete p.warn; toast("Expiry moved to Dec 15, 2026"); break; }
    case "repost": { const p = S.postings.find(x => x.id === id); S.tab.org = "post"; toast(`Copied “${p.title}” into a new posting`); break; }
    case "accept": { const c = S.cands[S.reviewFor].find(x => x.id === id); c.status = "Connected"; toast(`Connected with ${c.first} ${c.last}. Both of you were emailed.`); break; }
    case "decline": { const c = S.cands[S.reviewFor].find(x => x.id === id); c.status = "Declined"; toast(`${c.first} will be told the role isn't a fit.`); break; }
    case "invite": { const c = S.cands[S.reviewFor].find(x => x.id === id); c.status = "Invited"; toast(`${c.first} will see that you're interested.`); break; }
    case "postAnother": S.posted = null; break;
    case "approve": { const g = S.orgs.find(x => x.id === id); g.approval = "Approved"; toast(`${g.name} approved. Their postings can go live.`); break; }
    case "reject": { const g = S.orgs.find(x => x.id === id); g.approval = "Rejected"; toast(`${g.name} rejected.`); break; }
    case "askinfo": toast("Email sent asking for more information."); return;
    case "flagok": toast("Kept. Report closed."); b.closest(".card").remove(); return;
    case "flagrm": toast("Removed and owner notified."); b.closest(".card").remove(); return;
    case "recruit": S.recruited.add(+id); break;
    case "contactorg": toast("Opened an email to the organization's contact."); return;
    case "export": toast(`In the live app this downloads ${id}.`); return;
    case "saveWeights": toast("Weights saved. Matches will re-rank tonight."); return;
    default: return;
  }
  render();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.act === "weight") { S.weights[+t.dataset.id].weight = +t.value; const pos = document.activeElement.id; render(); document.getElementById(pos)?.focus(); return; }
  if (t.dataset.bind && S.wizard) { S.wizard[t.dataset.bind] = t.type === "checkbox" ? t.checked : t.value; if (t.dataset.bind === "radius") $("#wrv").textContent = t.value; }
});
document.addEventListener("change", e => { if (e.target.dataset.act === "reviewFor") { S.reviewFor = e.target.value; render(); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "mfa") { S.mfa = true; render(); }
  if (f === "msg") { const v = $("#msgIn").value.trim(); if (v) { S.conns.find(c => c.id === S.openConn).messages.push({ from: "You", text: v, at: "Just now" }); render(); } }
  if (f === "post") { S.posted = $("#pt").value.trim() || "Saturday food distribution (Nov 21)"; S.postings.unshift({ id: "new", title: S.posted, status: "Active", needed: +$("#pn").value || 10, filled: 0, interested: 0, expires: "Nov 20, 2026" }); render(); }
  if (f === "wizard") {
    const w = S.wizard; w.err = "";
    if (w.step === 0) {
      if (!w.first || !w.email || !w.dob) w.err = "Add your first name, email and date of birth to continue.";
      else { const age = (new Date("2026-10-16") - new Date(w.dob)) / 31557600000; if (age < 18) w.err = "VOLUNTR is for volunteers 18 and older right now. Ask a parent or guardian about PCC's family events instead."; }
      if (!w.err && !w.terms) w.err = "Please agree to the terms of use to continue.";
    }
    if (w.err) return render();
    if (w.step < WSTEPS.length - 1) w.step++; else { const ed = w.editing; S.wizard = null; S.role = "vol"; S.tab.vol = ed ? "profile" : "discover"; S.idx = 0; toast(ed ? "Preferences saved. Your matches will refresh." : "Welcome! Your profile is ready. Here are your best matches."); }
    render();
  }
});
addEventListener("resize", () => { if (!S.device) render(); });
render();
</script>
